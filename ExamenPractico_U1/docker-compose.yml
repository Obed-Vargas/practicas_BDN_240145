name: ExamenObed_240145


version: '3.8'

services:
  postgres_obed:
    image: postgres:15-alpine
    container_name: postgres_240145
    restart: always
    environment:
      POSTGRES_USER: obed
      POSTGRES_PASSWORD: "240145"
      POSTGRES_DB: db_240145
    ports:
      - "0.0.0.0:40145:5432"
    volumes:
      - postgres_data_240145:/var/lib/postgresql/data
    command: ["postgres", "-c", "listen_addresses=*"]

  mysql_obed:
    image: mysql:8.0
    container_name: mysql_240145
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "obed_root_password"
      MYSQL_DATABASE: db_240145
      MYSQL_USER: obed
      MYSQL_PASSWORD: "240145"
    ports:
      - "0.0.0.0:40146:3306"
    volumes:
      - mysql_data_240145:/var/lib/mysql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_240145
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: 240145@utxicotepec.edu.mx
      PGADMIN_DEFAULT_PASSWORD: "240145"
    ports:
      - "0.0.0.0:40147:80"
    depends_on:
      - postgres_obed

volumes:
  postgres_data_240145:
  mysql_data_240145: